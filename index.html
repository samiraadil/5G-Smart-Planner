<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>5G Smart Planner - Casablanca</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f4f8;
            color: #1a2332;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, #ffffff, #f8faff);
            border-bottom: 2px solid #e8edf5;
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
            flex-shrink: 0;
            z-index: 1000;
            position: relative;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-left .logo {
            font-size: 28px;
        }
        .header-left h1 {
            font-size: 20px;
            font-weight: 700;
            color: #0b1a33;
            letter-spacing: -0.5px;
        }
        .header-left .badge {
            font-size: 11px;
            background: #e8f0fe;
            color: #1a73e8;
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 7px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-primary {
            background: #1a73e8;
            color: #fff;
        }
        .btn-primary:hover {
            background: #1557b0;
        }
        .btn-success {
            background: #34a853;
            color: #fff;
        }
        .btn-success:hover {
            background: #2d8f47;
        }
        .btn-warning {
            background: #fbbc04;
            color: #1a2332;
        }
        .btn-warning:hover {
            background: #e5a800;
        }
        .btn-danger {
            background: #ea4335;
            color: #fff;
        }
        .btn-danger:hover {
            background: #d33426;
        }
        .btn-outline {
            background: transparent;
            color: #5f6b7a;
            border: 1.5px solid #d0d7e2;
        }
        .btn-outline:hover {
            background: #f0f4f8;
            border-color: #1a73e8;
            color: #1a73e8;
        }

        /* ===== APP ===== */
        .app {
            display: flex;
            height: calc(100vh - 64px);
        }

        /* ===== MAP ===== */
        .map-wrapper {
            flex: 1;
            position: relative;
            background: #e8edf5;
        }
        #map {
            width: 100%;
            height: 100%;
            background: #e8edf5;
        }
        #map .leaflet-tile-pane {
            filter: brightness(1) contrast(1);
        }

        /* ===== OVERLAY MAP ===== */
        .map-overlay {
            position: absolute;
            bottom: 24px;
            left: 24px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 14px;
            padding: 14px 24px;
            display: flex;
            gap: 32px;
            z-index: 500;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        .map-overlay .item {
            text-align: center;
        }
        .map-overlay .item .val {
            font-size: 20px;
            font-weight: 700;
            color: #0b1a33;
        }
        .map-overlay .item .val.green {
            color: #34a853;
        }
        .map-overlay .item .val.orange {
            color: #e37400;
        }
        .map-overlay .item .val.blue {
            color: #1a73e8;
        }
        .map-overlay .item .val.red {
            color: #ea4335;
        }
        .map-overlay .item .lbl {
            font-size: 10px;
            color: #5f6b7a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-top: 2px;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 360px;
            min-width: 320px;
            background: #ffffff;
            border-left: 1px solid #e8edf5;
            padding: 18px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: #f0f4f8;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #d0d7e2;
            border-radius: 4px;
        }

        .section {
            background: #f8faff;
            border-radius: 12px;
            padding: 14px 16px;
            border: 1px solid #e8edf5;
        }
        .section h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #5f6b7a;
            font-weight: 700;
            margin-bottom: 12px;
        }

        /* ===== METRICS ===== */
        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }
        .metric {
            background: #ffffff;
            border-radius: 8px;
            padding: 10px 12px;
            text-align: center;
            border: 1px solid #e8edf5;
            transition: all 0.2s;
        }
        .metric:hover {
            border-color: #1a73e8;
            box-shadow: 0 2px 8px rgba(26, 115, 232, 0.06);
        }
        .metric .num {
            font-size: 20px;
            font-weight: 700;
            color: #0b1a33;
        }
        .metric .num.green {
            color: #34a853;
        }
        .metric .num.orange {
            color: #e37400;
        }
        .metric .num.blue {
            color: #1a73e8;
        }
        .metric .num.red {
            color: #ea4335;
        }
        .metric .lbl {
            font-size: 9px;
            color: #5f6b7a;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 3px;
        }
        .metric .bar {
            width: 100%;
            height: 4px;
            background: #e8edf5;
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }
        .metric .bar .fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.8s ease;
        }
        .metric .bar .fill.green {
            background: #34a853;
        }
        .metric .bar .fill.orange {
            background: #fbbc04;
        }
        .metric .bar .fill.blue {
            background: #1a73e8;
        }
        .metric .bar .fill.red {
            background: #ea4335;
        }

        /* ===== STATIONS LIST ===== */
        .stations-list {
            max-height: 160px;
            overflow-y: auto;
        }
        .stations-list::-webkit-scrollbar {
            width: 3px;
        }
        .stations-list::-webkit-scrollbar-thumb {
            background: #d0d7e2;
            border-radius: 4px;
        }
        .station-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: #ffffff;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 3px;
            border-left: 3px solid #1a73e8;
            transition: all 0.2s;
            border: 1px solid #e8edf5;
            border-left-width: 3px;
        }
        .station-item:hover {
            background: #f8faff;
        }
        .station-item .name {
            font-weight: 600;
            color: #0b1a33;
        }
        .station-item .info {
            color: #5f6b7a;
            font-size: 10px;
        }
        .station-item .del {
            background: none;
            border: none;
            color: #b0b8c4;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
            transition: color 0.2s;
        }
        .station-item .del:hover {
            color: #ea4335;
        }
        .station-item.overloaded {
            border-left-color: #ea4335;
            background: #fef6f5;
        }

        /* ===== SUGGESTIONS ===== */
        .suggestion {
            background: #f0f7ff;
            border-left: 3px solid #1a73e8;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .suggestion .title {
            font-weight: 600;
            color: #0b1a33;
        }
        .suggestion .desc {
            color: #5f6b7a;
            font-size: 11px;
            margin-top: 2px;
        }
        .suggestion .badge {
            font-size: 9px;
            padding: 1px 10px;
            border-radius: 12px;
            font-weight: 700;
            display: inline-block;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .suggestion .badge.high {
            background: #fce8e6;
            color: #ea4335;
        }
        .suggestion .badge.ok {
            background: #e6f4ea;
            color: #34a853;
        }
        .suggestion .badge.medium {
            background: #fef7e0;
            color: #e37400;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #ffffff;
            border: 1px solid #e8edf5;
            border-radius: 12px;
            padding: 14px 24px;
            color: #0b1a33;
            font-size: 13px;
            z-index: 9999;
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.4s ease;
            max-width: 400px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
            font-weight: 500;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast.success {
            border-left: 4px solid #34a853;
        }
        .toast.warning {
            border-left: 4px solid #fbbc04;
        }
        .toast.error {
            border-left: 4px solid #ea4335;
        }

        /* ===== IMAGE DE FOND ===== */
        .map-bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.06;
            pointer-events: none;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .sidebar {
                width: 300px;
                min-width: 260px;
                padding: 14px;
            }
        }
        @media (max-width: 768px) {
            .app {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                min-width: unset;
                max-height: 45vh;
                border-left: none;
                border-top: 1px solid #e8edf5;
                padding: 14px;
            }
            .map-wrapper {
                height: 55vh;
            }
            .header {
                flex-wrap: wrap;
                height: auto;
                padding: 8px 14px;
                gap: 6px;
            }
            .header-actions .btn {
                font-size: 10px;
                padding: 4px 10px;
            }
            .metrics {
                grid-template-columns: 1fr 1fr 1fr;
            }
            .map-overlay {
                padding: 10px 16px;
                gap: 18px;
                bottom: 12px;
                left: 12px;
                flex-wrap: wrap;
            }
            .map-overlay .item .val {
                font-size: 16px;
            }
        }
        @media (max-width: 480px) {
            .metrics {
                grid-template-columns: 1fr 1fr;
            }
            .sidebar {
                max-height: 50vh;
            }
            .header-left h1 {
                font-size: 16px;
            }
            .map-overlay {
                gap: 12px;
                padding: 8px 14px;
            }
            .map-overlay .item .val {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-left">
            <span class="logo">📡</span>
            <h1>5G Smart Planner</h1>
            <span class="badge">Casablanca</span>
            <span class="badge" style="background:#e6f4ea;color:#34a853;">● Live</span>
        </div>
        <div class="header-actions">
            <button class="btn btn-success" onclick="generateUsers()">👥 Générer UE</button>
            <button class="btn btn-primary" onclick="addRandomStation()">📡 Ajouter gNB</button>
            <button class="btn btn-warning" onclick="optimizeNetwork()">🤖 IA Optimiser</button>
            <button class="btn btn-danger" onclick="clearAll()">🗑️ Reset</button>
        </div>
    </header>

    <!-- ===== APP ===== -->
    <div class="app">

        <!-- MAP -->
        <div class="map-wrapper">
            <!-- Image de fond (casablanca) -->
            <svg class="map-bg-image" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
                <rect width="800" height="600" fill="#f0f4f8"/>
                <circle cx="400" cy="300" r="200" fill="#e0e8f5" opacity="0.3"/>
                <circle cx="400" cy="300" r="120" fill="#d5e0f0" opacity="0.3"/>
                <circle cx="400" cy="300" r="60" fill="#c8d8ec" opacity="0.3"/>
                <text x="400" y="300" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="28" fill="#c0d0e0" opacity="0.5" font-weight="300">CASABLANCA</text>
                <text x="400" y="330" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#c8d8ec" opacity="0.4">🌍 Maroc</text>
            </svg>

            <div id="map"></div>

            <!-- Overlay -->
            <div class="map-overlay">
                <div class="item"><div class="val green" id="ovCoverage">0%</div><div class="lbl">Couverture</div></div>
                <div class="item"><div class="val blue" id="ovUsers">0</div><div class="lbl">Utilisateurs</div></div>
                <div class="item"><div class="val blue" id="ovStations">0</div><div class="lbl">Stations</div></div>
                <div class="item"><div class="val orange" id="ovLatency">0ms</div><div class="lbl">Latence</div></div>
            </div>
        </div>

        <!-- SIDEBAR -->
        <div class="sidebar">

            <!-- KPIs -->
            <div class="section">
                <h3>📊 Indicateurs temps réel</h3>
                <div class="metrics" id="metricsContainer">
                    <div class="metric"><div class="num blue" id="kpiCoverage">0%</div><div class="lbl">Couverture</div><div class="bar"><div class="fill blue" id="kpiCoverageBar" style="width:0%"></div></div></div>
                    <div class="metric"><div class="num green" id="kpiLatency">0ms</div><div class="lbl">Latence</div></div>
                    <div class="metric"><div class="num orange" id="kpiCapacity">0%</div><div class="lbl">Capacité</div><div class="bar"><div class="fill orange" id="kpiCapacityBar" style="width:0%"></div></div></div>
                    <div class="metric"><div class="num blue" id="kpiUsers">0</div><div class="lbl">UE connectés</div></div>
                    <div class="metric"><div class="num blue" id="kpiStations">0</div><div class="lbl">gNodeB actifs</div></div>
                    <div class="metric"><div class="num red" id="kpiSaturated">0</div><div class="lbl">Saturées</div></div>
                </div>
            </div>

            <!-- Stations -->
            <div class="section">
                <h3>📡 Stations gNodeB</h3>
                <div class="stations-list" id="stationsList">
                    <div style="color:#b0b8c4;font-size:12px;text-align:center;padding:12px 0;">Aucune station</div>
                </div>
            </div>

            <!-- Suggestions -->
            <div class="section">
                <h3>🤖 Suggestions IA</h3>
                <div id="suggestionsContainer">
                    <div style="color:#b0b8c4;font-size:12px;text-align:center;padding:8px 0;">En attente d'analyse...</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ============================================================
        //  5G SMART PLANNER - APPLICATION COMPLÈTE
        //  TOUS LES BOUTONS FONCTIONNENT !
        // ============================================================

        // ---- DONNÉES ----
        let stations = [];
        let users = [];
        let coverageData = [];
        let stationIdCounter = 1;
        let map = null;
        let mapMarkers = { stations: [], users: [] };
        let mapCircles = [];

        // ---- CONSTANTES ----
        const CENTER = [33.5731, -7.5898];
        const BOUNDS = [
            [33.52, -7.65],
            [33.62, -7.50]
        ];

        // ---- INIT MAP ----
        function initMap() {
            map = L.map('map', {
                center: CENTER,
                zoom: 12,
                zoomControl: false
            });

            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            L.control.zoom({ position: 'bottomright' }).addTo(map);
            map.fitBounds(BOUNDS);

            // Points d'intérêt
            const landmarks = [
                { name: "🕌 Mosquée Hassan II", lat: 33.6085, lng: -7.6330 },
                { name: "🏛️ Place Mohammed V", lat: 33.5961, lng: -7.6156 },
                { name: "🌊 Ain Diab", lat: 33.5880, lng: -7.7180 },
                { name: "⚓ Casa Port", lat: 33.5950, lng: -7.6000 },
                { name: "🛍️ Maarif", lat: 33.5850, lng: -7.6030 }
            ];
            landmarks.forEach(lm => {
                L.marker([lm.lat, lm.lng], {
                    icon: L.divIcon({
                        html: `<div style="font-size:16px;">📍</div>`,
                        className: '',
                        iconSize: [20, 20],
                        iconAnchor: [10, 20]
                    })
                }).addTo(map).bindPopup(`<b>${lm.name}</b>`);
            });

            // Stations initiales
            setTimeout(() => {
                addStation(33.5731, -7.5898);
                addStation(33.5850, -7.6200);
                addStation(33.5600, -7.5750);
                generateUsers();
            }, 400);
        }

        // ---- AJOUTER STATION ----
        function addStation(lat, lng) {
            if (!lat || !lng) {
                lat = 33.54 + Math.random() * 0.08;
                lng = -7.68 + Math.random() * 0.12;
            }
            const s = {
                id: `gNB-${String(stationIdCounter++).padStart(3, '0')}`,
                name: `gNodeB-${stations.length + 1}`,
                lat: lat,
                lng: lng,
                power: 40 + Math.floor(Math.random() * 10),
                frequency: 3.5,
                users: 0
            };
            stations.push(s);
            calculateCoverage();
            updateAll();
            toast(`📡 ${s.name} ajoutée à (${lat.toFixed(4)}, ${lng.toFixed(4)})`, 'success');
            return s;
        }

        function addRandomStation() {
            const lat = 33.54 + Math.random() * 0.08;
            const lng = -7.68 + Math.random() * 0.12;
            addStation(lat, lng);
        }

        // ---- SUPPRIMER STATION ----
        function deleteStation(id) {
            stations = stations.filter(s => s.id !== id);
            calculateCoverage();
            updateAll();
            toast(`🗑️ Station supprimée`, 'warning');
        }

        // ---- GÉNÉRER UTILISATEURS ----
        function generateUsers() {
            const count = 20 + Math.floor(Math.random() * 30);
            users = [];
            for (let i = 0; i < count; i++) {
                users.push({
                    id: `UE-${String(i + 1).padStart(3, '0')}`,
                    lat: 33.53 + Math.random() * 0.12,
                    lng: -7.70 + Math.random() * 0.16,
                    service: ['eMBB', 'uRLLC', 'mMTC'][Math.floor(Math.random() * 3)],
                    dataRate: 50 + Math.random() * 150
                });
            }
            calculateCoverage();
            updateAll();
            toast(`👥 ${users.length} utilisateurs générés`, 'success');
        }

        // ---- CALCUL COUVERTURE ----
        function calculateCoverage() {
            coverageData = [];
            if (stations.length === 0 || users.length === 0) return;

            users.forEach(user => {
                let bestRsrp = -200;
                let bestStation = null;
                stations.forEach(station => {
                    const dist = haversine(user.lat, user.lng, station.lat, station.lng);
                    const rsrp = station.power - 28 * Math.log10(dist * 1000 + 10);
                    if (rsrp > bestRsrp) {
                        bestRsrp = rsrp;
                        bestStation = station.id;
                    }
                });
                const status = bestRsrp > -80 ? 'good' : bestRsrp > -100 ? 'poor' : 'none';
                coverageData.push({
                    userId: user.id,
                    rsrp: Math.round(bestRsrp),
                    stationId: bestStation,
                    status: status
                });
            });

            stations.forEach(s => {
                s.users = coverageData.filter(c => c.stationId === s.id && c.status !== 'none').length;
            });
        }

        function haversine(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) ** 2;
            return R * 2 * Math.asin(Math.sqrt(a));
        }

        // ---- OPTIMISATION IA ----
        function optimizeNetwork() {
            if (stations.length === 0) {
                toast('⚠️ Ajoutez des stations d\'abord !', 'warning');
                return;
            }
            if (users.length === 0) {
                toast('⚠️ Générez des utilisateurs d\'abord !', 'warning');
                return;
            }

            calculateCoverage();
            const poor = coverageData.filter(c => c.status === 'poor' || c.status === 'none');
            const container = document.getElementById('suggestionsContainer');

            if (poor.length === 0) {
                container.innerHTML = `
                    <div class="suggestion" style="border-color:#34a853;background:#e6f4ea;">
                        <div class="title">✅ Réseau optimal</div>
                        <div class="desc">La couverture est excellente. Aucune amélioration nécessaire.</div>
                        <span class="badge ok">Parfait</span>
                    </div>
                `;
                toast('✅ Réseau optimisé !', 'success');
                return;
            }

            let sumLat = 0,
                sumLng = 0,
                count = 0;
            poor.forEach(p => {
                const u = users.find(u => u.id === p.userId);
                if (u) {
                    sumLat += u.lat;
                    sumLng += u.lng;
                    count++;
                }
            });

            const avgLat = sumLat / count + (Math.random() - 0.5) * 0.003;
            const avgLng = sumLng / count + (Math.random() - 0.5) * 0.003;
            const newStation = addStation(avgLat, avgLng);
            newStation.name = `🤖 IA-${stations.length}`;

            container.innerHTML = `
                <div class="suggestion" style="border-color:#e37400;background:#fef7e0;">
                    <div class="title">📡 Nouvelle station recommandée</div>
                    <div class="desc">📍 ${avgLat.toFixed(4)}, ${avgLng.toFixed(4)}</div>
                    <div class="desc">👥 ${poor.length} utilisateurs mal couverts</div>
                    <span class="badge high">Priorité haute</span>
                    <div style="margin-top:4px;font-size:11px;color:#34a853;">✅ Station ajoutée automatiquement</div>
                </div>
            `;

            calculateCoverage();
            updateAll();
            toast(`🤖 Station IA ajoutée ! ${poor.length} utilisateurs mieux couverts.`, 'success');
        }

            if (confirm('⚠️ Supprimer toutes les stations et utilisateurs ?')) {
                stations = [];
                users = [];
                coverageData = [];
                stationIdCounter = 1;
                updateAll();
                document.getElementById('suggestionsContainer').innerHTML = `
                    <div style="color:#b0b8c4;font-size:12px;text-align:center;padding:8px 0;">En attente d'analyse...</div>
                `;
                toast('🗑️ Tout a été effacé', 'warning');
            }
        }
